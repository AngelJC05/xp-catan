<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="250" height="250">
  <!-- Línea superior: borde oscuro (desplazada) -->
  <line x1="25" y1="50" x2="90" y2="18" 
        stroke="#3E1F0D" stroke-width="16" stroke-linecap="round"/>
  <!-- Línea superior: relleno -->
  <line x1="25" y1="50" x2="90" y2="18" 
        stroke="#8B4513" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Línea inferior: borde oscuro -->
  <line x1="10" y1="90" x2="80" y2="58" 
        stroke="#3E1F0D" stroke-width="16" stroke-linecap="round"/>
  <!-- Línea inferior: relleno -->
  <line x1="10" y1="90" x2="80" y2="58" 
        stroke="#8B4513" stroke-width="12" stroke-linecap="round"/>
</svg>