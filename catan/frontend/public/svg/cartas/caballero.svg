<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="250" height="300">
  <!-- Mitad izquierda del escudo (café madera clara) -->
  <path d="M 50 25 
           C 42 32, 25 36, 14 36 
           L 14 75 
           C 14 95, 32 112, 50 120 
           Z" 
        fill="#D2A679" stroke="#949494ff" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Mitad derecha del escudo (café madera oscura) -->
  <path d="M 50 25 
           C 58 32, 75 36, 86 36 
           L 86 75 
           C 86 95, 68 112, 50 120 
           Z" 
        fill="#A0703C" stroke="#a3a4a5ff" stroke-width="3" stroke-linejoin="round"/>

  <!-- Espada 1 (diagonal) -->
  <g transform="rotate(45 50 75)">
    <polygon points="50,38 54,50 54,95 50,105 46,95 46,50" 
             fill="#D5D8DC" stroke="#2C3E50" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="38" y="95" width="24" height="5" rx="2.5" 
          fill="#F1C40F" stroke="#2C3E50" stroke-width="2.5"/>
    <rect x="47" y="100" width="6" height="10" 
          fill="#7B241C" stroke="#2C3E50" stroke-width="2.5"/>
    <circle cx="50" cy="113" r="3.5" 
            fill="#F1C40F" stroke="#2C3E50" stroke-width="2.5"/>
  </g>
  
  <!-- Espada 2 (diagonal opuesta) -->
  <g transform="rotate(-45 50 75)">
    <polygon points="50,38 54,50 54,95 50,105 46,95 46,50" 
             fill="#D5D8DC" stroke="#2C3E50" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="38" y="95" width="24" height="5" rx="2.5" 
          fill="#F1C40F" stroke="#2C3E50" stroke-width="2.5"/>
    <rect x="47" y="100" width="6" height="10" 
          fill="#7B241C" stroke="#2C3E50" stroke-width="2.5"/>
    <circle cx="50" cy="113" r="3.5" 
            fill="#F1C40F" stroke="#2C3E50" stroke-width="2.5"/>
  </g>
</svg>